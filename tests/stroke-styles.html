<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Stroke style regression tests</title>
<h1>Stroke style regression tests</h1>
<p>From the repository root, run <code>python -m http.server 8000</code> and open
  <code>http://localhost:8000/tests/stroke-styles.html</code>.</p>
<pre id="results">Loading editor…</pre>
<iframe id="editor" width="1000" height="600" title="Editor under test"></iframe>
<script>
const frame = document.getElementById('editor');
frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    const app = frame.contentWindow.app;
    const results = document.getElementById('results');
    const report = [];
    const styles = ['solid', 'dashed', 'dotted', 'dashdotted', 'dashdotdotted',
        'loosely dashed', 'densely dashed', 'loosely dotted', 'densely dotted',
        'loosely dashdotted', 'densely dashdotted'];
    const standardTips = [
        'Stealth', 'Latex', 'Triangle', 'Kite', 'Diamond', 'Turned Square', 'Square', 'Rectangle', 'Circle', 'Ellipse',
        'Straight Barb', 'Arc Barb', 'Hooks', 'Tee Barb', 'Bar', 'Bracket', 'Parenthesis',
        'To', 'Computer Modern Rightarrow', 'Classical TikZ Rightarrow', 'Implies',
        'Butt Cap', 'Round Cap', 'Triangle Cap', 'Fast Round', 'Fast Triangle', 'Rays'
    ];
    const coords = [['A', 1, 2], ['B', 5, 2], ['C', 2, 3], ['D', 4, 4]].map(([name, x, y]) =>
        ({ type: 'TikZCoordinate', id: 'coord_' + name, name, x, y, showPoint: false }));
    const shapes = [
        { type: 'TikZSegment', from: 'A', to: 'B' },
        { type: 'TikZVector', from: 'A', to: 'B' },
        { type: 'TikZCircle', center: 'A', radius: 2 },
        { type: 'TikZCircle', center: 'A', center2: 'C', radius: 2 },
        { type: 'TikZArc', center: 'A', radius: 2, startAngle: 10, endAngle: 90 },
        { type: 'TikZRectangle', xMin: 1, yMin: 1, xMax: 3, yMax: 4 },
        { type: 'TikZPath', points: ['A', 'B', 'C'] },
        { type: 'TikZBezier', from: 'A', to: 'B', control1: 'C', control2: 'D' }
    ];

    function check(ok, message) {
        if (!ok) throw new Error(message);
    }

    function test(name, run) {
        try {
            run();
            report.push('PASS  ' + name);
        } catch (error) {
            report.push('FAIL  ' + name + '\n' + error.stack);
        }
    }

    function open(fixtures) {
        const objects = fixtures.map((shape, index) => ({ color: 'black', thickness: 'thin',
            lineStyle: 'solid', fill: 'none', arrowSize: 1, id: 'shape_' + index, ...shape }));
        app.loadProjectData({ objects: [...coords, ...objects], viewX: 40, viewY: 240, zoom: 40 });
        return app.objects.filter(obj => obj.type !== 'coord');
    }

    function canvasDash(shape) {
        const ctx = app.ctx;
        const stroke = ctx.stroke;
        const strokeRect = ctx.strokeRect;
        const dashes = [];
        function record(draw) {
            return function (...args) {
                dashes.push(this.getLineDash());
                return draw.apply(this, args);
            };
        }
        ctx.stroke = record(stroke);
        ctx.strokeRect = record(strokeRect);
        try {
            app.drawObject(shape);
        } finally {
            ctx.stroke = stroke;
            ctx.strokeRect = strokeRect;
        }
        check(dashes.length > 0, 'No canvas stroke for ' + shape.name);
        return dashes[0];
    }

    test('Every offered line style has a distinct canvas stroke on every supported shape', () => {
        const objects = open(shapes);
        app.selectedObjects = [objects[0]];
        app.updatePropertiesPanel();
        const select = doc.querySelector('#propertiesPanel [data-prop="lineStyle"]');
        const offered = Array.from(select.options, opt => opt.value);
        check(styles.every(style => offered.includes(style)), 'The line-style menu lost a documented option');
        app.selectedObjects = [];
        const patterns = new Set();
        for (const style of offered) {
            const actual = objects.map(shape => {
                shape.lineStyle = style;
                return canvasDash(shape).join(',');
            });
            check(actual.every(pattern => pattern === actual[0]), 'Inconsistent canvas stroke for ' + style);
            check((style === 'solid') === (actual[0] === ''), 'Incorrect canvas stroke for ' + style);
            check(!patterns.has(actual[0]), 'Duplicate dash pattern for ' + style);
            patterns.add(actual[0]);
        }
    });

    test('All documented line styles export on lines, vectors, circles, ellipses, arcs, rectangles, paths and Béziers', () => {
        const objects = open(shapes);
        for (const style of styles) {
            objects.forEach(shape => { shape.lineStyle = style; });
            const lines = app.generateTikZ().split('\n').filter(line => /^\s*\\draw\b/.test(line));
            check(lines.length === shapes.length, 'Missing exported strokes for ' + style);
            if (style !== 'solid') {
                const token = new RegExp('(?:\\[|,\\s*)' + style + '(?=,|\\])');
                lines.forEach(line => check(token.test(line), 'Lost ' + style + ' in ' + line));
            }
        }
    });

    function endpointPixels(shape, maskShaft = false, ends = [[1, 2], [5, 2]]) {
        app.ctx.clearRect(0, 0, app.canvas.width, app.canvas.height);
        app.drawObject(shape);
        return ends.map(([x, y]) => {
            const p = app.worldToScreen(x, y);
            const pixels = app.ctx.getImageData(p.x - 32, p.y - 16, 64, 32).data;
            return Array.from({ length: 64 * 32 }, (_, i) =>
                maskShaft && Math.abs(Math.floor(i / 64) - 16) <= 1 ? 0 : pixels[i * 4 + 3]);
        });
    }

    function arrowPixels(line, arrowEnd, size) {
        line.arrowEnd = arrowEnd;
        line.arrowSize = size;
        return endpointPixels(line, true);
    }

    test('Canvas draws the selected default, Stealth or latex tip at the requested ends and size', () => {
        const [line] = open([shapes[0]]);
        const tips = new Set();
        for (const [start, end] of [['<', '>'], ['Stealth', 'Stealth'], ['latex', 'latex']]) {
            for (const [spec, left, right] of [['-' + end, false, true], [start + '-', true, false],
                [start + '-' + end, true, true]]) {
                const [a, b] = arrowPixels(line, spec, 1);
                check(a.some(Boolean) === left && b.some(Boolean) === right, 'Wrong endpoint for ' + spec);
            }
            const normal = arrowPixels(line, '-' + end, 1)[1];
            const large = arrowPixels(line, '-' + end, 1.8)[1];
            check(large.filter(Boolean).length > normal.filter(Boolean).length, 'Arrow size ignored for ' + end);
            tips.add(normal.join(','));
        }
        check(tips.size === 3, 'Canvas renders different arrow types with the same tip');
    });

    test('Reloading an older vector preserves its style and exports a usable modern arrow library', () => {
        open([{ ...shapes[1], lineStyle: 'loosely dashdotted', arrowEnd: 'Stealth-Stealth', arrowSize: 1.75 }]);
        const project = JSON.parse(JSON.stringify(app.projectDrawing()));
        app.loadProjectData(project);
        app.showExport();
        const code = doc.getElementById('exportCode').value;
        const preamble = code.split('\\begin{tikzpicture}')[0];
        const commands = preamble.split('\n').map(line => line.split('%')[0]).join('\n');
        check(/\\usetikzlibrary\s*\{[^}]*\barrows\.meta\b[^}]*\}/.test(commands), 'Missing active arrows.meta declaration');
        const draw = code.split('\n').find(line => /^\s*\\draw\b/.test(line)) || '';
        check(draw.includes('loosely dashdotted') && draw.includes('Stealth') && draw.includes('1.75'),
            'Reload lost a vector style or arrow setting: ' + draw);
        // A default tip set with >= only applies to arrows using the < and > shorthands.
        const explicitTips = draw.match(/Stealth\[[^\]]*\bscale\s*=\s*1\.75\b[^\]]*\]/g) || [];
        check(explicitTips.length === 2 || (draw.includes('<->') && explicitTips.length === 1),
            'The configured scale must apply to both tips: ' + draw);
        app.closeExport();
    });

    function selectShape(shape) {
        app.selectedObjects = [shape];
        app.updatePropertiesPanel();
    }

    function arrowControl(property) {
        const select = doc.querySelector('#propertiesPanel select[data-prop="' + property + '"]');
        check(select, 'Missing arrow control: ' + property);
        return select;
    }

    function choose(property, value) {
        const select = arrowControl(property);
        check(!select.disabled, 'Disabled arrow control: ' + property);
        select.value = value;
        check(select.value === value, 'Missing ' + property + ' option: ' + value);
        select.dispatchEvent(new frame.contentWindow.Event('change', { bubbles: true }));
    }

    function checkArrow(type, placement, spec) {
        check(arrowControl('arrowType').value === type, 'Wrong arrow type for ' + spec);
        check(arrowControl('arrowPlacement').value === placement, 'Wrong placement for ' + spec);
        check(app.selectedObjects[0].arrowEnd === spec, 'Unexpected stored arrow specification for ' + spec);
    }

    test('Arrow type and placement can be edited independently on each supported shape', () => {
        for (const shape of [shapes[0], shapes[1], shapes[4], shapes[7]]) {
            const [object] = open([{ ...shape, arrowEnd: 'latex-', arrowSize: 1.5 }]);
            selectShape(object);
            checkArrow('latex', 'start', 'latex-');
            choose('arrowType', 'simple');
            checkArrow('simple', 'start', '<-');
            choose('arrowPlacement', 'both');
            checkArrow('simple', 'both', '<->');
            choose('arrowType', 'Stealth');
            checkArrow('Stealth', 'both', 'Stealth-Stealth');
            choose('arrowPlacement', 'end');
            checkArrow('Stealth', 'end', '-Stealth');
            const draw = app.generateTikZ().split('\n').find(line => /^\s*\\draw\b/.test(line));
            check(draw?.includes('-{Stealth[scale=1.5]}'), 'Lost tip, placement or size in ' + draw);
        }
    });

    test('A disabled arrow retains its placement across a project round trip', () => {
        const [line] = open([shapes[0]]);
        selectShape(line);
        checkArrow('none', 'end', 'none');
        choose('arrowPlacement', 'start');
        checkArrow('none', 'start', 'none');
        const project = JSON.parse(JSON.stringify(app.projectDrawing()));
        app.loadProjectData(project);
        selectShape(app.objects.find(obj => obj.id === line.id));
        checkArrow('none', 'start', 'none');
        choose('arrowType', 'latex');
        checkArrow('latex', 'start', 'Latex-');
        choose('arrowType', 'none');
        checkArrow('none', 'start', 'none');
        choose('arrowType', 'simple');
        checkArrow('simple', 'start', '<-');
    });

    test('Undo and redo restore each arrow control as a separate edit', () => {
        const [line] = open([{ ...shapes[0], arrowEnd: 'Stealth-Stealth' }]);
        selectShape(line);
        choose('arrowType', 'simple');
        choose('arrowPlacement', 'end');
        const undo = doc.getElementById('undoBtn');
        const redo = doc.getElementById('redoBtn');
        undo.click();
        checkArrow('simple', 'both', '<->');
        undo.click();
        checkArrow('Stealth', 'both', 'Stealth-Stealth');
        redo.click();
        checkArrow('simple', 'both', '<->');
        redo.click();
        checkArrow('simple', 'end', '->');
    });

    test('All standard tips export at the selected ends with the requested scale', () => {
        const [line] = open([{ ...shapes[0], arrowSize: 1.5 }]);
        selectShape(line);
        for (const name of standardTips) {
            choose('arrowType', name === 'Latex' ? 'latex' : name);
            const tip = '{' + name + '[scale=1.5]}';
            for (const [position, expected] of [['end', '-' + tip], ['start', tip + '-'], ['both', tip + '-' + tip]]) {
                choose('arrowPlacement', position);
                const code = app.generateTikZ();
                check(/^\\usetikzlibrary\{[^}]*\barrows\.meta\b[^}]*\}/m.test(code), 'Missing arrows.meta for ' + name);
                const draw = code.match(/^\s*\\draw\[(.*)\]\s+\(/m);
                check(draw && draw[1].split(/,\s*/).includes(expected), 'Expected ' + expected + ' in ' + code);
            }
        }
        choose('arrowType', 'Diamond');
        const size = doc.querySelector('#propertiesPanel input[data-prop="arrowSize"]');
        size.value = '1';
        size.dispatchEvent(new frame.contentWindow.Event('change', { bubbles: true }));
        check(/^\\usetikzlibrary\{[^}]*\barrows\.meta\b[^}]*\}/m.test(app.generateTikZ()),
            'An unscaled Diamond still requires arrows.meta');
    });

    test('Canvas renders each standard tip and distinguishes the different tip families', () => {
        // The dashed shaft ends in a gap, so even a flat cap can be seen at the endpoint.
        const [line] = open([{ ...shapes[0], arrowSize: 2, thickness: 'very thick', lineStyle: 'loosely dashed' }]);
        selectShape(line);
        const baseline = endpointPixels(line)[1].join(',');
        const representatives = ['Stealth', 'Triangle', 'Square', 'Diamond', 'Circle', 'Hooks', 'Bar', 'Rays'];
        const seen = new Set();
        for (const name of standardTips) {
            choose('arrowType', name === 'Latex' ? 'latex' : name);
            const ink = endpointPixels(line)[1].join(',');
            check(ink !== baseline, 'Canvas did not display ' + name);
            if (representatives.includes(name)) {
                check(!seen.has(ink), 'Canvas reused another shape for ' + name);
                seen.add(ink);
            }
        }
    });

    test('Project round trip preserves named tips and old Latex spellings at their original scale', () => {
        const names = [...standardTips, 'latex', 'LaTeX'];
        open(names.map(name => ({ ...shapes[0], arrowEnd: name + '-', arrowSize: 1 })));
        const project = JSON.parse(JSON.stringify(app.projectDrawing()));
        app.loadProjectData(project);
        const draws = app.generateTikZ().split('\n').filter(line => /^\s*\\draw\b/.test(line));
        names.forEach((name, i) => {
            selectShape(app.objects.find(obj => obj.id === 'shape_' + i));
            const value = name.toLowerCase() === 'latex' ? 'latex' : name;
            checkArrow(value, 'start', name + '-');
            check(draws[i].includes(name + '-') || draws[i].includes('{' + name + '}-'),
                'Reload changed the nominal tip in ' + draws[i]);
            choose('arrowPlacement', 'end');
            checkArrow(value, 'end', '-' + name);
        });
    });

    test('Open curves draw circles at the requested ends; closed Béziers keep their original stroke', () => {
        const arc = { ...shapes[4], startAngle: 0, endAngle: 90 };
        for (const [shape, ends] of [[arc, [[3, 2], [1, 4]]], [shapes[7], [[1, 2], [5, 2]]]]) {
            const [curve] = open([{ ...shape, arrowSize: 2, thickness: 'thick' }]);
            const baseline = endpointPixels(curve, false, ends);
            for (const [spec, active] of [['Circle-', [true, false]], ['-Circle', [false, true]], ['Circle-Circle', [true, true]]]) {
                curve.arrowEnd = spec;
                const pixels = endpointPixels(curve, false, ends);
                pixels.forEach((region, i) => {
                    // Compare ink area so subpixel changes in the trimmed curve do not count as tips.
                    const added = region.reduce((sum, alpha, j) => sum + alpha - baseline[i][j], 0) / 255;
                    check(active[i] ? added > 8 : Math.abs(added) < 5, shape.type + ' misdraws endpoint ' + i + ' for ' + spec);
                });
            }
        }
        const [closed] = open([{ ...shapes[7], closed: true, arrowSize: 2, thickness: 'thick' }]);
        endpointPixels(closed);
        const before = app.canvas.toDataURL();
        closed.arrowEnd = 'Circle-Circle';
        endpointPixels(closed);
        check(app.canvas.toDataURL() === before, 'A closed Bézier was trimmed or given arrowheads');
    });

    test('Oversized tips on a short arc or cubic leave no reversed shaft', () => {
        const curves = open([
            { ...shapes[4], startAngle: 0, endAngle: 3, lineStyle: 'dashed', arrowSize: 3 },
            { ...shapes[7], control1: 'A', control2: 'B', lineStyle: 'dashed', arrowSize: 3 }
        ]);
        app.getCoordByName('B').x = 1.1; // A four-pixel cubic; the arc is also about four pixels long.
        const ctx = app.ctx;
        const stroke = ctx.stroke;
        const fill = ctx.fill;
        function hasShaft(curve) {
            ctx.clearRect(0, 0, app.canvas.width, app.canvas.height);
            app.drawObject(curve);
            return ctx.getImageData(0, 0, app.canvas.width, app.canvas.height).data.some((v, i) => i % 4 === 3 && v > 0);
        }
        try {
            // Render just the dashed shaft, so that the filled circles cannot conceal an erroneous stroke.
            ctx.stroke = function (...args) { if (this.getLineDash().length) stroke.apply(this, args); };
            ctx.fill = () => {};
            for (const curve of curves) {
                check(hasShaft(curve), 'Missing reference shaft for ' + curve.type);
                curve.arrowEnd = 'Circle-Circle';
                check(!hasShaft(curve), 'Overlapping tips left a shaft on the short ' + curve.type);
            }
        } finally {
            ctx.stroke = stroke;
            ctx.fill = fill;
        }
    });

    results.dataset.status = report.every(line => line.startsWith('PASS')) ? 'passed' : 'failed';
    results.textContent = report.join('\n');
});
frame.src = '../tikz-draw.html';
</script>
</html>
